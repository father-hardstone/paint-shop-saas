<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paintly" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO Meta Tags -->
    <title>Paintly - Modern Paint & Utility Shop Cloud SaaS</title>
    <meta name="description" content="Paintly is the leading SaaS platform for paint and hardware retailers. Calculate precision pigment tints, prevent inventory loss, manage billing in PKR, and fulfill paint orders effortlessly." />
    <meta name="keywords" content="paint shop software, paint store POS, paint tinting management, paint mixing calculator, paint inventory, utility shop billing, hardware SaaS Pakistan" />
    <meta name="author" content="Paintly Technologies" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://paintly.app/" />
    <meta property="og:title" content="Paintly - Modern Paint & Utility Shop Cloud SaaS" />
    <meta property="og:description" content="Precision tint formulation, real-time volume deduction, PKR billing, and cloud storage built for modern paint retailers." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paintly - Modern Paint & Utility Shop SaaS" />
    <meta name="twitter:description" content="Precision tint formulation, real-time volume deduction, PKR billing, and cloud storage built for modern paint retailers." />
    <meta name="twitter:image" content="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Paintly PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('Paintly ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
